<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        .sidebar { width: 250px; min-height: 100vh; }
        .sidebar .nav-link {
            color: #212529;
            font-weight: 500;
            font-size: 1.1rem;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 5px;
        }
        .sidebar .nav-link:hover:not(.active) { background-color: #f8f9fa; }
        .sidebar .nav-link.active {
            background-color: #0d6efd !important;
            color: white !important;
        }
        .sidebar .nav-link i { font-size: 1.25rem; }
    </style>
</head>
<body class="bg-light p-4">

<div class="d-flex">
    <div class="sidebar d-flex flex-column flex-shrink-0 p-3 bg-white border-end me-4 rounded shadow-sm">
        <ul class="nav nav-pills flex-column mb-auto gap-1">
            <li class="nav-item">
                <a href="{{ url_for('staff_dashboard') }}" class="nav-link d-flex align-items-center gap-3">
                    <i class="bi bi-house"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('staff_profile') }}" class="nav-link active d-flex align-items-center gap-3">
                    <i class="bi bi-person"></i>
                    <span>Profile</span>
                </a>
            </li>
        </ul>
        <hr>
        <div class="logout-section">
            <a href="{{ url_for('signin') }}" class="nav-link d-flex align-items-center gap-3">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>

    <div class="flex-grow-1 p-5 bg-white rounded shadow-sm border">
        <div class="container bg-white p-5 rounded border shadow-sm" style="max-width: 600px; margin: 0 auto;">
            <h3 class="fw-bold mb-4 text-center"><i class="bi bi-person-circle me-2"></i>Edit Profile</h3>
            
            <form action="{{ url_for('staff_profile') }}" method="POST">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-medium">First Name</label>
                        <input type="text" class="form-control" name="first_name" value="{{ staff['first_name'] }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-medium">Last Name</label>
                        <input type="text" class="form-control" name="last_name" value="{{ staff['last_name'] }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium">Email Address</label>
                    <input type="email" class="form-control" name="email" value="{{ staff['email'] }}" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-medium">Password</label>
                    <input type="text" class="form-control" name="password" value="{{ staff['password'] }}" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Save Changes</button>
            </form>
        </div>

    </div>
</div>
</body>
</html>
