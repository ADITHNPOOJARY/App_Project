<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Trekking Management Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>

    <nav class="navbar navbar-custom py-3">
    <div class="container-fluid justify-content-center">
        <span class="navbar-brand mb-0 h1 fs-2 fw-bold text-secondary text-center">
            Trekking Management Application
        </span>
    </div>
</nav>

    <div class="register-container">
        <h4 class="text-center fw-bold mb-4" style="color: #1e293b;">Sign In</h4>

        <form method="POST" action="/signin">
            <div class="mb-3">
                <input type="email" class="form-control" name="email" placeholder="Email" required>
            </div>

            <div class="mb-3">
                <input type="password" class="form-control" name="password" placeholder="Password" required>
            </div>
            
        

            <a href="/forgot-password" class="small text-decoration-none fw-bold" style="color: #0d6efd;">
                Forgot password?
            </a>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-register">Login</button>
            </div>

            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}
            <div class="text-center">
                <small class="text-muted fw-semibold">
                    Don't have an account? 
                    <a href="{{ url_for('signup') }}" class="text-decoration-none fw-bold" style="color: #0d6efd;">Sign up</a>
                </small>
            </div>
        </form>
    </div>
</body>
</html>
