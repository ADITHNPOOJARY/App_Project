<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .sidebar { width: 240px; min-height: 100vh; background-color: #f8f9fa; }
        .nav-link { color: #4b5563; font-weight: 500; margin-bottom: 5px; }
        .nav-link:hover { background-color: #e9ecef; }
        .nav-link.active { background-color: #eff6ff !important; color: #0d6efd !important; font-weight: 600; }
    </style>
</head>
<body>

<div class="d-flex">
    <div class="sidebar d-flex flex-column flex-shrink-0 p-3 border-end">
        <ul class="nav nav-pills flex-column mb-auto">
            <li><a href="{{ url_for('user_dashboard') }}" class="nav-link d-flex align-items-center gap-3"><i class="bi bi-house-door"></i> Dashboard</a></li>
            <li><a href="{{ url_for('browse_treks') }}" class="nav-link active d-flex align-items-center gap-3"><i class="bi bi-binoculars"></i> Browse Treks</a></li>
            <li><a href="{{ url_for('user_history') }}" class="nav-link d-flex align-items-center gap-3"><i class="bi bi-clock-history"></i> History</a></li>
            <li><a href="{{ url_for('user_profile') }}" class="nav-link d-flex align-items-center gap-3"><i class="bi bi-person"></i> Profile</a></li>
        </ul>
        <hr>
        <div class="logout-section">
            <a href="{{ url_for('signin') }}" class="nav-link d-flex align-items-center gap-3"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-grow-1 p-5 bg-light">
        <div class="container bg-white p-5 rounded shadow-sm border" style="max-width: 600px; margin: 0 auto;">
            <h3 class="fw-bold mb-4 text-center"><i class="bi bi-person-circle me-2"></i>Edit Profile</h3>
            
            <form action="{{ url_for('user_profile') }}" method="POST">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-medium">First Name</label>
                        <input type="text" class="form-control" name="first_name" value="{{ user['first_name'] }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-medium">Last Name</label>
                        <input type="text" class="form-control" name="last_name" value="{{ user['last_name'] }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium">Email Address</label>
                    <input type="email" class="form-control" name="email" value="{{ user['email'] }}" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-medium">Password</label>
                    <input type="text" class="form-control" name="password" value="{{ user['password'] }}" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Save Changes</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
