<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Trekking Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* Standardized Sidebar Styling */
        .sidebar { width: 250px; min-height: 100vh; }
        .sidebar .nav-link {
            color: #212529; font-weight: 500; font-size: 1.1rem;
            padding: 10px 16px; border-radius: 8px; margin-bottom: 5px;
        }
        .sidebar .nav-link:hover:not(.active) { background-color: #f8f9fa; }
        .sidebar .nav-link.active { background-color: #0d6efd !important; color: white !important; }
        .sidebar .nav-link i { font-size: 1.25rem; }

        /* Dashboard specific icon styling */
        .card-icon {
            font-size: 2.5rem;
            opacity: 0.8;
        }
    </style>
</head>
<body class="bg-light p-4">

    <div class="d-flex">
        <div class="sidebar d-flex flex-column flex-shrink-0 p-3 bg-white border-end me-4 rounded shadow-sm">
            <ul class="nav nav-pills flex-column mb-auto gap-1">
                <li>
                    <a href="{{ url_for('admin_dashboard') }}" class="nav-link active d-flex align-items-center gap-3">
                        <i class="bi bi-house"></i> <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('treks') }}" class="nav-link d-flex align-items-center gap-3">
                        <i class="bi bi-compass"></i> <span>Treks</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('staff') }}" class="nav-link d-flex align-items-center gap-3">
                        <i class="bi bi-person"></i> <span>Staff</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('users') }}" class="nav-link d-flex align-items-center gap-3">
                        <i class="bi bi-people"></i> <span>Users</span>
                    </a>
                </li>
            </ul>
            <hr>
            <div class="logout-section">
                <a href="{{ url_for('signin') }}" class="nav-link d-flex align-items-center gap-3">
                    <i class="bi bi-box-arrow-right"></i> <span>Logout</span>
                </a>
            </div>
        </div>

        <div class="flex-grow-1 p-5 bg-white rounded shadow-sm border">
            
            <h3 class="fw-bold mb-5">Overview Statistics</h3>
            
            <div class="row g-4">
                <div class="col-md-6 col-lg-3">
                    <div class="card bg-primary text-white border-0 shadow h-100 rounded-3">
                        <div class="card-body d-flex justify-content-between align-items-center p-4">
                            <div>
                                <h6 class="card-title text-uppercase fw-semibold mb-2">Registered Users</h6>
                                <h2 class="fw-bold m-0">{{ total_users }}</h2>
                            </div>
                            <i class="bi bi-people-fill card-icon"></i>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-lg-3">
                    <div class="card bg-success text-white border-0 shadow h-100 rounded-3">
                        <div class="card-body d-flex justify-content-between align-items-center p-4">
                            <div>
                                <h6 class="card-title text-uppercase fw-semibold mb-2">Available Staff</h6>
                                <h2 class="fw-bold m-0">{{ total_staff }}</h2>
                            </div>
                            <i class="bi bi-person-check-fill card-icon"></i>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-lg-3">
                    <div class="card bg-warning text-dark border-0 shadow h-100 rounded-3">
                        <div class="card-body d-flex justify-content-between align-items-center p-4">
                            <div>
                                <h6 class="card-title text-uppercase fw-semibold mb-2">Total Bookings</h6>
                                <h2 class="fw-bold m-0">{{ total_bookings }}</h2>
                            </div>
                            <i class="bi bi-ticket-detailed-fill card-icon text-dark opacity-75"></i>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-lg-3">
                    <div class="card bg-danger text-white border-0 shadow h-100 rounded-3">
                        <div class="card-body d-flex justify-content-between align-items-center p-4">
                            <div>
                                <h6 class="card-title text-uppercase fw-semibold mb-2">Total Treks</h6>
                                <h2 class="fw-bold m-0">{{ total_treks }}</h2>
                            </div>
                            <i class="bi bi-compass-fill card-icon"></i>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
