<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Trekking Management Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>

    <nav class="navbar navbar-custom py-3">
    <div class="container-fluid justify-content-center">
        <span class="navbar-brand mb-0 h1 fs-2 fw-bold text-secondary text-center">
            Trekking Management Application
        </span>
    </div>
</nav>

    <div class="register-container">
        <h4 class="text-center fw-bold mb-4" style="color: #1e293b;">Sign Up</h4>

        <form method="POST" action="/signup">
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <input type="text" class="form-control" name="firstname" placeholder="First Name" required>
                </div>
                <div class="col-6">
                    <input type="text" class="form-control" name="lastname" placeholder="Last Name" required>
                </div>
            </div>

            <div class="mb-3">
                <input type="email" class="form-control" name="email" placeholder="Email" required>
            </div>

            <div class="mb-3">
                <input type="password" class="form-control" name="password" placeholder="Password" required>
            </div>

            <div class="mb-3">
                <input type="password" class="form-control" name="confirm_password" placeholder="Confirm Password" required>
            </div>

            <div class="mb-4 d-flex align-items-center justify-content-between">
                <label class="form-label mb-0 text-secondary fw-semibold">User type:</label>
                <select class="form-select" name="role" style="width: 70%;" required>
                    <option value="" selected disabled>-- Select Role --</option>
                    <option value="user">User</option>
                    <option value="staff">Staff</option>
                </select>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-register">Register</button>
            </div>
            
            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}

            <div class="text-center">
                <small class="text-muted fw-semibold">
                    Already have an account? 
                    <a href="{{ url_for('signin') }}" class="text-decoration-none fw-bold" style="color: #0d6efd;">Sign in</a>
                </small>
            </div>
        </form>
    </div>
</body>
</html>
